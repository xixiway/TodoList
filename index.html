<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>我的待办事项</h1>
    <input id="todoInput" type="text" placeholder="请输入任务">
    <button id="addButton">添加</button>
    <p id="message"></p>
    
    <div id="fileterButtons">
        <button id="allButton">全部</button>
        <button id="activeButton">未完成</button>
        <button id="completedButton">已完成</button>
    </div>

    <ul id="todoList">

        <p id="taskCount"></p>
    </ul>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
